services:
  sshw-config:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GOPROXY: "${GOPROXY:-https://proxy.golang.org,direct}"
    image: sshw-config:local
    restart: unless-stopped
    init: true
    ports:
      - "${SSHW_BIND_ADDRESS:-0.0.0.0}:${SSHW_PORT:-9110}:8080"
    environment:
      SSHW_ADMIN_USERNAME: "${SSHW_ADMIN_USERNAME:-admin}"
      SSHW_ADMIN_PASSWORD: "${SSHW_ADMIN_PASSWORD:-}"
      SSHW_MASTER_KEY: "${SSHW_MASTER_KEY:-}"
      SSHW_DEFAULT_PROFILE: "${SSHW_DEFAULT_PROFILE:-default}"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - sshw-config-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  sshw-config-data:
    name: "${SSHW_DATA_VOLUME:-sshw-config-data}"
